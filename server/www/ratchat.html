<!DOCTYPE html>
<html>
	<head>
		<script>
			if(localStorage.getItem('ratMode') === 'dark'){
				document.documentElement.setAttribute('data-theme', 'dark');
			}
		</script>
		<meta name="robots" content="noindex, nofollow">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
		
		<title>ratchat</title>
		<link rel="stylesheet" href="https://unpkg.com/98.css@0.1.21/dist/98.css" integrity="sha384-15ft94Qa+wtquckGuqoUZVwmRnPrMFakV20jxURH5clORpGUeXAbhNK5x6aVebrD" crossorigin="anonymous">
		<style>
			/* GENERIC */
			html {
				background-color: #000000;
			}

			body {
				height: 100dvh;
				margin: 0;
				padding: 0rem;
				box-sizing: border-box;
				overflow: hidden;
			}

			/* OBJECTS */
			.window {
				display: flex;
				flex-direction: column;
				margin: 0;
				width: auto;
			}

			.title-bar-controls {
				display: flex;
				gap: 0.125rem;
				padding: 0;
			}
			.title-bar-text{
				cursor: default;
				user-select: none;
			}
			.title-bar-controls button {
				margin: 0 !important;
				cursor: pointer;
			}

			.window-body {
				display: flex;
				flex-direction: column;
				height: calc(100dvh - 2rem);
				margin: 0;
				padding: 0.2rem;
			}
			
			.layoutRow {
				display: flex;
				flex-direction: row;
				flex-grow: 1;
				overflow: hidden;
			}

			.layoutColumn {
				display: flex;
				flex-direction: column;
				flex-grow: 1;
				overflow: hidden;
			}

			/* COMPONENTS */
			#bgUpload {
				display: none;
			}		
			
			/* Emote Window */

			#emotePicker-search {
				padding: 0 0.5rem;
				min-width: 0;
				font-size: .625rem;
				height: 1.125rem;
				box-sizing: border-box;
				margin-bottom: .125rem;
			}	
			#emotePicker-search:focus {
				outline: none;
			}
			#emotePicker-search::placeholder{
				color: #999999;
			}

			/* Chat Pane */
			#chat-frame {
				flex-grow: 1;
				min-height: 1rem;
				background-color: #ffffff;
				background-blend-mode: normal;
				background-repeat: repeat;
				background-position: center;
				background-size: 25%;
				box-shadow: inset -0.0625rem -0.0625rem #ffffff,
							inset 0.0625rem 0.0625rem #0a0a0a, 
							inset -0.125rem -0.125rem #dfdfdf, 
							inset 0.125rem 0.125rem #808080;
				padding-top: 0.25rem;
				padding-bottom: 0.25rem;
				margin-top: 0.25rem;
				margin-bottom: 0.25rem;
				display: flex;
				flex-direction: column;
			}

			#chat-viewport {
				height: 100%;
				width: 100%;
				overflow-y: auto;
			}

			#chat-list {
				list-style-type: none;
				margin: 0;
				padding: 0;
				display: flex;
				flex-direction: column;
				justify-content: flex-end;
				min-height: 100%;
				font-size: large;
			}
			#chat-list .message-author {
				font-weight: bold;
				color: var(--user-color, black);
				margin-right: .15rem;
			}
			.chat-item{
				padding-top: 0.2rem;
				padding-bottom: 0.2rem;
				padding-left: 1rem;
				padding-right: 0.2rem;
				white-space: pre-wrap;
				word-break: break-word;
			}
			.chat-item:hover {
				background-color: rgba(0, 0, 0, 0.05);
			}
			.chat-item.isHidden:hover {
				cursor: pointer;
			}

			/* User Panel */
			#activeUsers-frame {
				flex: 0 0 9.7600rem; 
				background: #ffffff;
				box-shadow: 
							inset -0.0625rem -0.0625rem #ffffff, 
							inset 0.0625rem 0.0625rem #0a0a0a, 
							inset -0.125rem -0.125rem #dfdfdf, 
							inset 0.125rem 0.125rem #808080;
				padding: 0.3125rem;
				margin-top: 0.25rem;
				margin-bottom: 0.25rem;			
				overflow-y: auto;
				overflow-x: hidden;
				flex-shrink: 0;
				display: flex;
				flex-direction: column;
			}
			#activeUsers-frame.isCollapsed {
				flex-basis: 0 !important;
				padding: 0 !important;
				margin: 0 !important;
				overflow: hidden;
				border: none;
			}
			#activeUsers-frame.isCollapsed + .scrollbar, 
			#activeUsers-frame.isCollapsed ~ .scrollbar,
			#chat-frame ~ .scrollbar:has(+ #activeUsers-frame.isCollapsed) {
				margin-right: 0;
			}

			#activeUsers-list {
				flex-grow: 1;
				overflow-y: auto;
				overflow-x: hidden;
				list-style: none;
				padding: 0;
				margin: 0.25rem;
				font-size: large;
			}

			.activeUsers-item {
				white-space: nowrap;
				display: flex;
				align-items: center;
				width: 100%;
				overflow: hidden;
			}
			.activeUsers-item span:nth-child(3) {
				flex-shrink: 1;
				flex-grow: 1;
				min-width: 0;
			}

			.activeUsers-item-modBadge {
				display: inline-block;
				line-height: 1;
				width: 0.8rem;
				height: 0.8rem;
				vertical-align: middle;
				margin-right: 0.125rem;
				margin-bottom: 0.375rem;
				color: #008000;
			}

			.activeUsers-item-orb {
				display: inline-block;
				width: 0.7rem;
				height: 0.7rem;
				border-radius: 50%;
				margin-right: 0.375rem;
				margin-bottom: 0.175rem;
				flex-shrink: 0;
				border: 0.0625rem solid rgba(0,0,0,0.2);
			}
	
			.activeUsers-item-orb.isOnline {
				background: radial-gradient(circle at 0.1875rem 0.1875rem, #52ff52, #008000);
				box-shadow: 0.0625rem 0.0625rem 0.0625rem rgba(0,0,0,0.3);
			}

			.activeUsers-item-orb.isAfk {
				background: radial-gradient(circle at 0.1875rem 0.1875rem, #ffb84d, #ff8c00);
				box-shadow: 0.0625rem 0.0625rem 0.0625rem rgba(0,0,0,0.3);
			}

			.activeUsers-item-count {
				color: #575963;
				text-align: right;
			}

			.activeUsers-item-status {
				display: inline-block;
				font-size: 0.75rem;
				color: #575963;
				margin-left: 0.75rem;
				margin-right: 0.75rem;
				white-space: nowrap;
				overflow: hidden;
				position: relative;
				height: 1rem;
				width: 8rem;
			}
			.activeUsers-item-status .emote {
				height: 0.9125rem;
				vertical-align: top;
				margin: -0.1rem;
			}

			.activeUsers-item-statusScroll {
				display: inline-block;
				white-space: nowrap;
				padding-left: 0.125rem;
			}

			.activeUsers-item-statusScroll.isAnimated {
				animation: activeUsers-item-statusMarquee 8s linear infinite;
			}

			@keyframes activeUsers-item-statusMarquee {
				0%		{ transform: translateX(0); }
				15%		{ transform: translateX(0); }
				80%		{ transform: translateX(calc(-100% + 8rem)); }
				95%		{ transform: translateX(calc(-100% + 8rem)); }
				95.01%	{ transform: translateX(0); }
				100%	{ transform: translateX(0); }
			}

			#activeUsers-lurkerCount {
				color:#575963;
				font-size: small;
				min-height: 1rem;
				flex-shrink: 0;
				text-align: center;
			}

			/* Footer */
			.footer {
				display: flex;
				gap: 0.125rem;
				padding-top: 0.125rem;
				align-items: stretch;
				height: 2rem;
				flex-wrap: nowrap;
			}

			.footer-button {
				padding: 0;
				box-sizing: border-box;
				min-width: 2rem;
				max-width: 2rem;
				font-size: 1.7rem;
				display: flex;
				flex-shrink: 0;
				line-height: 0;
				align-items: center;
				justify-content: center;
				background: #c0c0c0;
				border: none;
				cursor: pointer;
			}
			.footer-button-submit {
				max-width: 7.5475rem !important;
				min-width: 7.5475rem !important;
				font-size: 1rem !important;
			}

			#footer-chatBox-form {
				display: flex;
				flex: 1 1 0;
				gap: 0.125rem;
			}

			#footer-chatBox-input {
				border: none;
				height: 100%;
				padding: 0 0.5rem;
				flex: 1 1 0;
				min-width: 0;
				font-size: 1rem;
				box-sizing: border-box;
				margin-right: 0.0625rem;
				text-indent: 0.0625rem;
			}
			#footer-chatBox-input:focus {
				outline: none;
			}

			/* Popup Window */
			.popup {
				visibility: hidden;
				position: fixed;
				user-select: none;
			}

			.popup.isVisible {
				visibility: visible;
			}
			.popup.isFocused {
				user-select: text;
			}

			.popup .window-body {
				height: auto;
				max-height: 100%;
			}

			.popup-frame {
				flex-grow: 1;
				position: relative;
				background-color: #ffffff;
				box-shadow: inset -0.0625rem -0.0625rem #ffffff,
							inset 0.0625rem 0.0625rem #0a0a0a,
							inset -0.125rem -0.125rem #dfdfdf,
							inset 0.125rem 0.125rem #808080;
				overflow: hidden;
			}

			.popup-viewport {
				position: absolute;
				inset: 0.625rem 0.625rem;
				overflow-y: auto;
			}

			.popup .scrollbar {
				margin-top: 0;
				margin-bottom: 0;
				margin-right: 0;
			}

			/* Scrollbar */
			.scrollbar {
				width: 1.2rem;
				background: #dfdfdf;
				display: flex;
				flex-direction: column;
				flex-shrink: 0;
				margin: 0.25rem 0.2rem;
			}

			.scrollbar-button {
				width: 1.2rem;
				height: 1.2rem;
				padding: 0;
				min-width: 1.2rem;
				min-height: 1.2rem;
				font-size: 0.6rem;
				display: flex;
				align-items: center;
				justify-content: center;
				background: #c0c0c0;
				border: none;
				box-shadow: 
							inset 0.0625rem 0.0625rem #ffffff, 
							inset -0.0625rem -0.0625rem #0a0a0a, 
							inset 0.125rem 0.125rem #dfdfdf, 
							inset -0.125rem -0.125rem #808080;
			}
			.scrollbar-track {
				flex-grow: 1;
				position: relative;
				background-size: 0.2rem 0.2rem;
				background-position: 0 0, 0 0.1rem, 0.1rem -0.1rem, -0.1rem 0rem;
				background-color: #dfdfdf;
				box-shadow: 
						inset -0.0625rem -0.0625rem #ffffff, 
						inset 0.0625rem 0.0625rem #808080;
			}
			.scrollbar-thumb {
				width: 100%;
				height: 100%;
				background: #c0c0c0;
				position: absolute;
				left: 50%;
				transform: translateX(-50%);
				border: none;	
				box-shadow: 
						inset 0.0625rem 0.0625rem #ffffff, 
						inset -0.0625rem -0.0625rem #0a0a0a, 
						inset 0.125rem 0.125rem #dfdfdf, 
						inset -0.125rem -0.125rem #808080;
			}

			/* UTILITES */
			.hideDefaultScrollbar {
				scrollbar-width: none;
				-ms-overflow-style: none;
			}

			.hideDefaultScrollbar::-webkit-scrollbar {
				display: none;
			}

			.hasBg{
				background-color: rgba(255, 255, 255, 0.5) !important;
				background-blend-mode: overlay !important;
			}

			/* Text Formatting */

			.format-bold {
				font-weight: bold;
				font-size: 1rem;
			}
			.format-italics {
				font-style: italic;
			}
			.format-mono {
				font-family: 'VT323', monospace;
				font-variant-numeric: tabular-nums;
				font-size: 1.275rem;
				display: inline-block;
				transform-origin: bottom;
			}

			.emote {
				height: 1.5rem;
				vertical-align: bottom;
				margin: -0.1rem;
			}

			/* Text Coloring */

			.textColor-error {
				color: #D12626;
			}

			.textColor-info {
				color: #575963;
			}

			.textColor-welcome {
				color: #0084FF;
			}

			.textColor-announcement {
				color: #6eab6e;
			}

			.textColor-game{
				color: #6f0475;
			}

			/* Game Text Coloring */
			.gameColor-clear {
				color: initial;
			}

			.gameColor-gold {
				color: #b8860b;
			}

			.gameColor-silver {
				color: #708090;
			}

			.gameColor-bronze {
				color: #8c5a2b;
			}

			.gameColor-blue {
				color: #0084FF;
			}

			.gameColor-brown {
				color: #7a4a2b;
			}

			.gameColor-black {
				color: #1a1a1a;
			}

			.gameColor-gray {
				color: #6b6b6b;
			}

			.gameColor-navy {
				color: #1b2a5e;
			}

			.gameColor-green {
				color: #6eab6e;
			}

			.gameColor-orange {
				color: #c2650c;
			}

			.gameColor-pink {
				color: #c2408a;
			}

			.gameColor-purple {
				color: #6f0475;
			}

			.gameColor-teal {
				color: #157a72;
			}

			.gameColor-red {
				color: #D12626;
			}

			.gameColor-white {
				color: #a8a8a8;
			}

			.gameColor-yellow {
				color: #a68a00;
			}

			/* THEME (Dark Mode) */
			[data-theme="dark"] .window {
				background: #000000;
				box-shadow:
					inset -0.0625rem -0.0625rem #111111,
					inset 0.0625rem 0.0625rem #444444,
					inset -0.125rem -0.125rem #222222,
					inset 0.125rem 0.125rem #555555;
			}

			[data-theme="dark"] .title-bar {
				background: linear-gradient(to right, #2b004f, #a46cff);
				color: #ffffff;
			}

			[data-theme="dark"] .popup-frame,
			[data-theme="dark"] #emotePicker-search,
			[data-theme="dark"] #chat-frame,
			[data-theme="dark"] #activeUsers-frame,
			[data-theme="dark"] #footer-chatBox-input {
				background-color: #2a2a2a;
				color: #ffffff;
				box-shadow:
					inset 0.0625rem 0.0625rem #111111,
					inset -0.0625rem -0.0625rem #444444,
					inset 0.125rem 0.125rem #222222,
					inset -0.125rem -0.125rem #555555;
			}

			[data-theme="dark"] #emotePicker-search::placeholder {
				color: #888888;
			}

			[data-theme="dark"] .chat-item {
				color: #ffffff;
			}
			[data-theme="dark"] .chat-item:hover {
				background-color: rgba(255, 255, 255, 0.08);
			}

			[data-theme="dark"] .footer-button {
				background: #3a3a3a;
				color: #ffffff;
				box-shadow:
					inset -0.0625rem -0.0625rem #111111,
					inset 0.0625rem 0.0625rem #444444,
					inset -0.125rem -0.125rem #222222,
					inset 0.125rem 0.125rem #555555;
			}
			[data-theme="dark"] .footer-button:active {
				box-shadow:
					inset 0.0625rem 0.0625rem #111111,
					inset -0.0625rem -0.0625rem #444444,
					inset 0.125rem 0.125rem #222222,
					inset -0.125rem -0.125rem #555555;
			}

			/* Scrollbars */
			[data-theme="dark"] .scrollbar {
				background: #2a2a2a;
			}

			[data-theme="dark"] .scrollbar-button {
				background: #3a3a3a;
				color: #ffffff;
				box-shadow:
					inset -0.0625rem -0.0625rem #111111,
					inset 0.0625rem 0.0625rem #444444,
					inset -0.125rem -0.125rem #222222,
					inset 0.125rem 0.125rem #555555;
			}

			[data-theme="dark"] .scrollbar-button:active {
				box-shadow:
					inset 0.0625rem 0.0625rem #111111,
					inset -0.0625rem -0.0625rem #444444,
					inset 0.125rem 0.125rem #222222,
					inset -0.125rem -0.125rem #555555;
			}

			[data-theme="dark"] .scrollbar-track {
				background-color: #555555;
				box-shadow: 
						inset 0.0625rem 0.0625rem #333333, 
						inset -0.0625rem -0.0625rem #666666;
			}

			[data-theme="dark"] .scrollbar-thumb {
				background: #3a3a3a;
				color: #ffffff;
				box-shadow:
					inset -0.0625rem -0.0625rem #111111,
					inset 0.0625rem 0.0625rem #444444,
					inset -0.125rem -0.125rem #222222,
					inset 0.125rem 0.125rem #555555;
			}

			/* Text Coloring */
			[data-theme="dark"] .textColor-error { color: #ff8a8a; }
			[data-theme="dark"] .textColor-info { color: #d0d0d0; }
			[data-theme="dark"] .textColor-welcome { color: #8ac7ff; }
			[data-theme="dark"] .textColor-announcement { color: #9df79d; }
			[data-theme="dark"] .textColor-game { color: #e889ed; }

			[data-theme="dark"] .gameColor-clear { color: #ffffff; }
			[data-theme="dark"] .gameColor-gold { color: #e0b84d; }
			[data-theme="dark"] .gameColor-silver { color: #b8c0c8; }
			[data-theme="dark"] .gameColor-bronze { color: #c9915a; }
			[data-theme="dark"] .gameColor-blue { color: #8ac7ff; }
			[data-theme="dark"] .gameColor-brown { color: #b8825a; }
			[data-theme="dark"] .gameColor-black { color: #cfcfcf; }
			[data-theme="dark"] .gameColor-gray { color: #a8a8a8; }
			[data-theme="dark"] .gameColor-navy { color: #7d95d6; }
			[data-theme="dark"] .gameColor-green { color: #9df79d; }
			[data-theme="dark"] .gameColor-orange { color: #e8973f; }
			[data-theme="dark"] .gameColor-pink { color: #e075b8; }
			[data-theme="dark"] .gameColor-purple { color: #e889ed; }
			[data-theme="dark"] .gameColor-teal { color: #4fc3b8; }
			[data-theme="dark"] .gameColor-red { color: #ff8a8a; }
			[data-theme="dark"] .gameColor-white { color: #e0e0e0; }
			[data-theme="dark"] .gameColor-yellow { color: #e0c95a; }
		</style>
	</head>

	<body>
	<input id="bgUpload" type="file" accept="image/*">
	
	<div class="window">
		<div class="title-bar">
			<div class="title-bar-text">ratchat32.exe</div>
			<div class="title-bar-controls">
				<button aria-label="Minimize"></button>
				<button id="TESTINGIDREMOVE" aria-label="Maximize"></button>
				<button aria-label="Close"></button>
			</div>
		</div>

		<div class="window-body">
			<div class="layoutRow">
				<div id="chat-frame" class="hideDefaultScrollbar">
					<div id="chat-pin-frame" class="hideDefaultScrollbar">
						<ul id="chat-pin-list"></ul>
					</div>
					<div id="chat-viewport" class="hideDefaultScrollbar">
						<ul id="chat-list"></ul>
					</div>
				</div>

				<div class="scrollbar">
					<button id="chat-button-up" class="scrollbar-button">&#9650;</button>
					<div id="chat-track" class="scrollbar-track">
						<div id="chat-thumb" class="scrollbar-thumb"></div>
					</div>
					<button id="chat-button-down" class="scrollbar-button">&#9660;</button>
				</div>
				
				<div id="activeUsers-frame" class="hideDefaultScrollbar">
					<ul id="activeUsers-list"></ul>
					<div id="activeUsers-lurkerCount"></div>
				</div>

			</div>

			<div class="footer">
				<form id="footer-chatBox-form" action="">
					<input id="footer-chatBox-input" type="text" autocomplete="off" />
					<button class="footer-button footer-button-submit" type="submit">Send</button>
				</form>
				<button id="footer-button-emotes" class="footer-button" type="button" title="emotes">&#9786;</button>
				<button id="footer-button-users" class="footer-button" type="button" title="users">&#128101;</button>
			</div>
		</div>		
	</div>
	<template id="popup-template">
		<div class="popup">
			<div class="window">

				<div class="title-bar">
					<div class="title-bar-text"></div>
					<div class="title-bar-controls">
						<button aria-label="Close"></button>
					</div>
				</div>

				<div class="window-body">
					<div class="popup-frame">
						<div class="popup-viewport hideDefaultScrollbar"></div>
					</div>
				</div>

			</div>
		</div>
	</template>

	<script>
		async function loadVerifiedFont(url, expectedHashBase64, fontFamily, fontWeight, fontStyle, mimeType){
			const response = await fetch(url);
			if(!response.ok){
				throw new Error(`font fetch failed: ${response.status}`);
			}

			const buffer = await response.arrayBuffer();
			const digest = await crypto.subtle.digest('SHA-384', buffer);
			const actualHashBase64 = btoa(String.fromCharCode(...new Uint8Array(digest)));

			if(actualHashBase64 !== expectedHashBase64){
				throw new Error('font integrity check failed, refusing to load');
			}

			const blob = new Blob([buffer], {type: mimeType});
			const blobUrl = URL.createObjectURL(blob);

			const fontFace = new FontFace(fontFamily, `url(${blobUrl})`, {weight: fontWeight, style: fontStyle});
			const loadedFace = await fontFace.load();
			document.fonts.add(loadedFace);
		}

		//FUNCTIONS//
		function displayClientMessage(string, className){
			const li = document.createElement('li');
			li.classList.add('chat-item');
			if(className){
				li.classList.add(className);
			}
			li.textContent = string;
			renderMessage(li);
		}

		function isDuplicateChat(message){
			const dupe = document.querySelector(`li[data-id="${message.id}"]`);

			if(dupe && dupe.dataset.timestamp === String(message.timestamp)){
				return true;
			}

			return false;
		}

		function isDuplicateEvent(message){
			for(const popup of popups){
				if(popup.dataset.event === message.event && popup.dataset.id === String(message.id) && popup.dataset.timestamp === String(message.timestamp)){
					return true;
				}
			}

			return false;
		}

		async function handleGameEvent(message){
			if(mutedEvents.includes(message.event.toLowerCase())){
				return;
			}

			if(isDuplicateChat(message)){
				return;
			}

			if(isDuplicateEvent(message)){
				return;
			}

			const candidates = getPopupsByEvent(message.event);
			const match = candidates.find(popup => popup.dataset.id === String(message.id));

			let target = null;
			if(match){
				match.dataset.timestamp = message.timestamp;
				target = match.querySelector('.popup-viewport');
			}
			else if(toRenderMode[message.event] === 'direct'){
				target = chatList;
			}
			else{
				const builder = toBuilder[message.event];

				if(!builder){
					console.warn(`no popup builder registered for event type: ${message.event}`);
					return;
				}

				const popup = builder(message.id);

				const used = candidates.map(candidatePopup => parseInt(candidatePopup.dataset.instance, 10));

				let instance = 1;

				while(used.includes(instance)){
					instance++;
				}

				popup.dataset.event = message.event;
				popup.dataset.id = message.id;
				popup.dataset.timestamp = message.timestamp;
				popup.dataset.instance = instance;

				let titleText = message.event;

				if(instance > 1){
					titleText = `${message.event} (${instance})`;
				}

				popup.querySelector('.title-bar-text').textContent = titleText;

				if(candidates.length > 0){
					const reference = candidates[candidates.length - 1];
					const cascadePosition = calculateCascadePosition(reference.offsetTop, reference.offsetLeft, popup.offsetWidth);

					popup.style.top = cascadePosition.top + 'px';
					popup.style.left = cascadePosition.left + 'px';
				}

				target = popup.querySelector('.popup-viewport');
			}

			const renderMode = toRenderMode[message.event];
			if(!renderMode){
				console.warn(`no render mode registered for event type: ${message.event}`);
				return;
			}

			if(renderMode === 'replace'){
				target.replaceChildren();
			}

			for(let lineIndex = 0; lineIndex < message.content.length; lineIndex++){
				const line = message.content[lineIndex];
				const li = document.createElement('li');

				line.forEach(chunk => {
					const span = document.createElement('span');
					span.textContent = chunk.text;
					if(chunk.color !== 'normal'){
						span.classList.add(`gameColor-${chunk.color}`);
					}
					chunk.format.forEach(tag => {
						span.classList.add(`format-${tag}`);
					});
					li.appendChild(span);
				});

				li.classList.add('chat-item', 'textColor-game');

				if(renderMode === 'direct'){
					renderMessage(li);
				}
				else{
					target.appendChild(li);
				}

				if(lineIndex < message.content.length - 1 && message.msdelay > 0){
					await wait(message.msdelay);
				}
			}
		}

		function handleMessage(message){
			if(message.id >= 0){
				if(isDuplicateChat(message)){
					return;
				}
			}

			const className = toClass[message.type];
			const li = buildMessage(message, className);
			if(message.spoiler){
				li.dataset.spoiler = 'true';
			}

			if(message.author && mutedUsers.includes(message.author.substring(7).toLowerCase())){
				let wrapper = null;
				if(message.spoiler){
					wrapper = hideMessage(li, '[a muted user sent a spoiler. click to reveal]', '[MUTED][SPOILER]', message.id, message.timestamp);
				}
				else{
					wrapper = hideMessage(li, '[a muted user said something. click to reveal]', '[MUTED]', message.id, message.timestamp);
				}

				renderMessage(wrapper);
				return;
			}
		
			if(message.author && message.spoiler){
				const wrapper = hideMessage(li, `[${message.author.substring(7)} sent a spoiler — click to reveal]`, '[SPOILER]', message.id, message.timestamp);
				renderMessage(wrapper);
				return;
			}

			renderMessage(li);
		}

		function buildMessage(message, className){
			const li = document.createElement('li');
			li.classList.add('chat-item');
			const contentSpan = document.createElement('span');
			let raw = message.content;

			if (className) {
				li.classList.add(className);
			}

			if(message.id >=0){
				const date = new Date(message.timestamp);
				const dateStr = date.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
				const timeSpan = document.createElement('span');

				timeSpan.textContent = dateStr;
				timeSpan.style = 'color:grey; font-size:small; margin-right:0.5rem';
		
				li.appendChild(timeSpan);
			}

			if(message.id >= 0 && message.author){
				const userColor = message.author.substring(0, 7);
				const userBaseNick = message.author.substring(7);
				const authorSpan = document.createElement('span');
				authorSpan.className = 'message-author';
				authorSpan.style.setProperty('--user-color', userColor);
				authorSpan.textContent = userBaseNick + ': ';
				li.appendChild(authorSpan);

				if(message.type === 'toClientMarkov'){
					const parts = message.content.split('|');
					const gen = parts[0];
					const seed = parts[1];
					li.setAttribute('title', seed ? `Message ID: ${message.id} by: ${gen} with seed: ${seed}` : `Message ID: ${message.id} by: ${gen}`);
				}
				else{
					li.setAttribute('title', `Message ID: ${message.id}`);
				}

				li.setAttribute('data-id', message.id);
				li.setAttribute('data-timestamp', message.timestamp);
			}

			if(message.type === 'toClientMarkov'){
				const parts = message.content.split('|');
				raw = parts.slice(2).join('|');
			}

			if(window.DOMPurify && message.id >= 0){
				const emoted = emotify(raw);
				contentSpan.innerHTML = DOMPurify.sanitize(emoted);
			}
			else{
				contentSpan.textContent = raw;
			}

			if(message.format && message.format.length > 0){
				message.format.forEach(tag => {
					contentSpan.classList.add(`format-${tag}`);
				});
			}
		
			li.appendChild(contentSpan);

			return li;
		}

		function hideMessage(li, placeholderText, helperText, id, timestamp){
			const wrapper = document.createElement('li');
			let revealed = false;

			li.title += ' — click to hide';
			li.style.display = 'none';
			li.dataset.inside = 'true';

			const helperSpan = document.createElement('span');
			helperSpan.textContent = helperText;
			helperSpan.style.cssText = 'color:grey; font-size:small; margin-right:0.5rem';
			helperSpan.classList.add('helper-span');
			li.prepend(helperSpan);

			const placeholder = document.createElement('span');
			placeholder.textContent = placeholderText;

			wrapper.classList.add('chat-item', 'textColor-info', 'isHidden');
			wrapper.setAttribute('data-id', id);
			wrapper.setAttribute('data-timestamp', timestamp);
			wrapper.title = `Message ID: ${id} — click to reveal`;
			wrapper.appendChild(placeholder);
			wrapper.appendChild(li);

			wrapper.addEventListener('click', () => {
				if(!revealed){
					placeholder.style.display = 'none';
					li.style.display = '';
					wrapper.classList.remove('textColor-info');
					wrapper.title = `Message ID: ${id} — click to hide`;
					revealed = true;
				}
				else{
					placeholder.style.display = '';
					li.style.display = 'none';
					wrapper.classList.add('textColor-info');
					wrapper.title = `Message ID: ${id} — click to reveal`;
					revealed = false;
				}
			});

			return wrapper;
		}

		function unhideMessage(wrapper){
			const inner = wrapper.querySelector('[data-inside="true"]');
			if(inner){
				const helperSpan = inner.querySelector('.helper-span');
				if(helperSpan){
					helperSpan.remove();
				}

				inner.title = inner.title.replace(' — click to hide', '');
				inner.style.display = '';

				return inner;
			}
			return null;
		}

		function renderMessage(li){
			const messageContainer = document.getElementById('chat-viewport');
			const isAtBottom = messageContainer.scrollHeight - messageContainer.clientHeight <= messageContainer.scrollTop + 20;
			chatList.appendChild(li);
			if(chatList.children.length > 255){
				chatList.firstChild.remove();
			}
			if(isAtBottom){
				messageContainer.scrollTop = messageContainer.scrollHeight;
			}
		}

		function muteMessageHistory(basenick){
			const candidates = Array.from(chatList.children);
			const matches = candidates.filter(li => {
				//defensive check to prevent muting a muted message
				if(li.classList.contains('isHidden')){
					const inner = li.querySelector('[data-inside="true"]');
					if(!inner || inner.dataset.spoiler !== 'true'){
						return false;
					}
				}

				const authorSpan = li.querySelector('.message-author');
				if(!authorSpan){
					return false;
				}

				return authorSpan.textContent.trim().toLowerCase() === (basenick + ':').toLowerCase();
			});

			matches.forEach(li => {
				let target = null;
				let wrapper = null;

				if(li.classList.contains('isHidden')){
					target = unhideMessage(li);
					if(!target){
						return;
					}
				}
				else{
					target = li;
				}

				const clone = target.cloneNode(true);
				if(clone.dataset.spoiler === 'true'){
					wrapper = hideMessage(clone, '[a muted user sent a spoiler. click to reveal]', '[MUTED][SPOILER]', clone.dataset.id, clone.dataset.timestamp);
				}
				else{
					wrapper = hideMessage(clone, '[a muted user said something. click to reveal]', '[MUTED]', clone.dataset.id, clone.dataset.timestamp);
				}

				if(wrapper){
					li.replaceWith(wrapper);
				}
			});
		}

		function unmuteMessageHistory(basenick){
			const candidates = Array.from(chatList.children);
			const matches = candidates.filter(wrapper =>{
				const authorSpan = wrapper.querySelector('.message-author');
				if(!wrapper.classList.contains('isHidden')){
					return false;
				}
				if(!authorSpan){
					return false;
				}

				return authorSpan.textContent.trim().toLowerCase() === (basenick + ':').toLowerCase();
			});

			matches.forEach(wrapper => {
				const inner = unhideMessage(wrapper);
				if(!inner){
					return;
				}

				if(inner.dataset.spoiler === 'true'){
					const userName = inner.querySelector('.message-author')?.textContent.trimEnd().slice(0, -1) || 'someone';
					wrapper.replaceWith(hideMessage(inner, `[${userName} sent a spoiler — click to reveal]`, '[SPOILER]', inner.dataset.id, inner.dataset.timestamp));
				}
				else{
					wrapper.replaceWith(inner);
				}
			});
		}

		function emotify(text){
			return text.split(' ').map(word => {
				if(emotes[word]){
					return `<img src="${emotes[word]}" title="${word}" alt="${word}" class="emote" crossorigin="anonymous">`;
				}
				return word;
			}).join(' ');
		}

		function filterEmotesGrid(filter){
			const lowerFilter = (filter || '').trim().toLowerCase();
			document.querySelectorAll('#emotePicker-viewport .emote-selectable').forEach(img => {
				img.style.display = img.dataset.name.includes(lowerFilter) ? '' : 'none';
			});
			document.getElementById('emotePicker-viewport').scrollTop = 0;
		}

		function appendSentHistory(text){
			sentHistory.unshift(text);
			if(sentHistory.length > 50){
				sentHistory.pop();
			}
			historyIndex = -1;
			draftMessage = '';
		}

			return new Promise(resolve => setTimeout(resolve, ms));

		function buildPopupFromTemplate(){
			const template = document.getElementById('popup-template');
			const clone = template.content.cloneNode(true);
			const popup = clone.querySelector('.popup');

			return popup;
		}

		function centerPopup(popup){
			const centeredTop = calculateCenterOffset(popup.offsetHeight, window.innerHeight);
			const centeredLeft = calculateCenterOffset(popup.offsetWidth, window.innerWidth);

			const safePosition = calculateSafePosition(centeredTop, centeredLeft, popup.offsetWidth);

			popup.style.top = safePosition.top + 'px';
			popup.style.left = safePosition.left + 'px';
		}

		function renderPopups(popup){
			if(!popup){
				console.warn('renderPopups called without popup');
				return;
			}

			popups.delete(popup);
			popups.add(popup);

			let index = 0;
			popups.forEach(stackedPopup => {
				index++;
				stackedPopup.style.zIndex = index;
				stackedPopup.classList.remove('isFocused');
			});

			popup.classList.add('isFocused');
		}

		function buildPopupDragListener(popup){
			const titleBar = popup.querySelector('.title-bar');
			const titleBarControls = popup.querySelector('.title-bar-controls');

			titleBar.addEventListener('mousedown', (mousedownEvent) => {
				if(titleBarControls.contains(mousedownEvent.target)){
					return;
				}

				const startingMouseTop = mousedownEvent.pageY;
				const startingMouseLeft = mousedownEvent.pageX;

				const startingPositionTop = popup.offsetTop;
				const startingPositionLeft = popup.offsetLeft;

				document.onmousemove = (mousemoveEvent) => {
					const mouseDeltaTop = mousemoveEvent.pageY - startingMouseTop;
					const mouseDeltaLeft = mousemoveEvent.pageX - startingMouseLeft;

					const newTop = startingPositionTop + mouseDeltaTop;
					const newLeft = startingPositionLeft + mouseDeltaLeft;

					const safePosition = calculateSafePosition(newTop, newLeft, popup.offsetWidth);

					popup.style.top = safePosition.top + 'px';
					popup.style.left = safePosition.left + 'px';
				};

				document.onmouseup = () => {
					document.onmousemove = null;
					document.onmouseup = null;
				};

				mousedownEvent.preventDefault();
			});
		}

		function buildPopupClickListener(popup){
			const titleBarControls = popup.querySelector('.title-bar-controls');

			popup.addEventListener('mousedown', (mousedownEvent) => {
				if(titleBarControls.contains(mousedownEvent.target)){
					return;
				}

				renderPopups(popup);
			});
		}

		function getPopupsByEvent(event){
			const candidates = [];

			for(const popup of popups){
				if(popup.dataset.event === event){
					candidates.push(popup);
				}
			}

			return candidates;
		}

		function calculateSafePosition(currentTop, currentLeft, popupWidth){
			const minimum = 2 * remPixels;
			let coordinates = {top: 0, left: 0};

			const minTop = 0;
			const maxTop = window.innerHeight - minimum;
			const minLeft = -(popupWidth - minimum);
			const maxLeft = window.innerWidth - minimum;

			const topPosition = clampPosition(currentTop, minTop, maxTop);
			const leftPosition = clampPosition(currentLeft, minLeft, maxLeft);
			coordinates = {top: topPosition, left: leftPosition};
		
			return coordinates;
		}

		function calculateCascadePosition(currentTop, currentLeft, popupWidth){
			const proposedTop = currentTop + (2 * remPixels);
			const proposedLeft = currentLeft + (2 * remPixels);

			const safePosition = calculateSafePosition(proposedTop, proposedLeft, popupWidth);

			let top = proposedTop;
			let left = proposedLeft;

			if(safePosition.top !== top){
				top = 0;
			}

			if(safePosition.left !== left){
				left = 0;
			}

			return {top, left};
		}

		function calculateCenterOffset(itemSize, containerSize){
			const offset = (containerSize - itemSize) / 2;

			return offset;
		}

		function clampPosition(currentPosition, minimumPosition, maximumPosition){
			let clamped;

			if(currentPosition < minimumPosition){
				clamped = minimumPosition;
			}
			else if(currentPosition > maximumPosition){
				clamped = maximumPosition;
			}
			else{
				clamped = currentPosition;
			}

			return clamped;
		}

		//Fake scrollbar
		function buildScrollbar(prefix){
			const scrolldiv = document.createElement('div');
			scrolldiv.className = 'scrollbar';

			const buttonUp = document.createElement('button');
			buttonUp.id = `${prefix}-button-up`;
			buttonUp.className = 'scrollbar-button';
			buttonUp.textContent = '▲';

			const track = document.createElement('div');
			track.id = `${prefix}-track`;
			track.className = 'scrollbar-track';

			const thumb = document.createElement('div');
			thumb.id = `${prefix}-thumb`;
			thumb.className = 'scrollbar-thumb';
			track.appendChild(thumb);

			const buttonDown = document.createElement('button');
			buttonDown.id = `${prefix}-button-down`;
			buttonDown.className = 'scrollbar-button';
			buttonDown.textContent = '▼';

			scrolldiv.appendChild(buttonUp);
			scrolldiv.appendChild(track);
			scrolldiv.appendChild(buttonDown);

			const scrollbar = {
				scrolldiv: scrolldiv,
				track: track,
				thumb: thumb,
				buttonUp: buttonUp,
				buttonDown: buttonDown
			};
			return scrollbar;
		}

		function buildScrollbarListener(scrollbar){
			const container = scrollbar.container;
			const thumb = scrollbar.thumb;
			const track = scrollbar.track;
			const content = scrollbar.content;

			//sync thumb position to scroll
			container.onscroll = function (){
				const scrollPos = container.scrollTop;
				const maxScroll = container.scrollHeight - container.clientHeight;

				const clampedScroll = Math.max(0, Math.min(scrollPos, maxScroll));

				const trackSpace = track.clientHeight - thumb.clientHeight;
				thumb.style.top = (clampedScroll / (maxScroll || 1)) * trackSpace + 'px';
			};

			if(scrollbar.buttonUp){
				scrollbar.buttonUp.onclick = () =>
					container.scrollBy(0, -50);

			}

			if(scrollbar.buttonDown){
				scrollbar.buttonDown.onclick = () =>
					container.scrollBy(0, 50);
			}

			function renderThumb(){
				thumb.style.height =
					Math.max(
						(container.clientHeight / container.scrollHeight) * track.clientHeight,
						20
					) + 'px';
			}

			renderThumb();

			//dynamic thumb resizing using a self-executing function for the MutationObserver
			new MutationObserver(renderThumb).observe(content, {childList: true, subtree: true});

			//sync resize event
			window.addEventListener('resize', renderThumb);

			//click and drag thumb
			thumb.addEventListener('mousedown', (mousedownEvent) => {
				const startingMouseTop = mousedownEvent.pageY;
				const startingScrollTop = container.scrollTop;

				const maxScroll = container.scrollHeight - container.clientHeight;
				const trackSpace = track.clientHeight - thumb.clientHeight;

				document.onmousemove = (mousemoveEvent) => {
					const mouseDeltaTop = mousemoveEvent.pageY - startingMouseTop;
					const scrollDelta = (mouseDeltaTop / trackSpace) * maxScroll;

					container.scrollTop = startingScrollTop + scrollDelta;
				};

				document.onmouseup = () => {
					document.onmousemove = null;
					document.onmouseup = null;
				};

				mousedownEvent.preventDefault();
			});

			//track click scrolling
			track.addEventListener('click', (clickEvent) => {
				if(clickEvent.target === thumb){
					return;
				}

				const trackRect = track.getBoundingClientRect();
				const thumbRect = thumb.getBoundingClientRect();

				const clickPositionInTrack = clickEvent.clientY - trackRect.top;
				const thumbPositionInTrack = thumbRect.top - trackRect.top;

				if(clickPositionInTrack < thumbPositionInTrack){
					container.scrollBy(0, -container.clientHeight);
				}
				else{
					container.scrollBy(0, container.clientHeight);
				}
			});
		}
